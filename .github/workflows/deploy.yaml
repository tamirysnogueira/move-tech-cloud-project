name: Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: container-registry.br-se1.magalu.cloud
  IMAGE_NAME: cloud-project

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        pip install poetry
        poetry install --no-root

    - name: Executar testes com cobertura
      # O addopts do pyproject já roda com --cov e falha se ficar abaixo de 90%.
      run: poetry run pytest

    - name: Publicar cobertura no resumo do job
      if: always()
      run: |
        echo '### Cobertura de testes' >> "$GITHUB_STEP_SUMMARY"
        poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login no Container Registry
      run: |
        docker login https://${{ env.REGISTRY }} \
          -u ${{ secrets.MGC_REGISTRY_USER }} \
          -p ${{ secrets.MGC_REGISTRY_PASSWORD }}

    - name: Build e push da imagem
      run: |
        IMAGE=${{ env.REGISTRY }}/${{ secrets.MGC_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest
        docker build -t $IMAGE .
        docker push $IMAGE

    - name: Configurar kubectl
      run: |
        echo "${{ secrets.MGC_KUBECONFIG }}" > kubeconfig.yaml

    - name: Criar Secret do registry
      run: |
        export KUBECONFIG=kubeconfig.yaml
        kubectl create secret docker-registry registry-secret \
          --docker-server=${{ env.REGISTRY }} \
          --docker-username=${{ secrets.MGC_REGISTRY_USER }} \
          --docker-password=${{ secrets.MGC_REGISTRY_PASSWORD }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Criar Secret do banco
      run: |
        export KUBECONFIG=kubeconfig.yaml
        kubectl create secret generic db-secret \
          --from-literal=url=${{ secrets.DATABASE_URL }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy no Kubernetes
      run: |
        export KUBECONFIG=kubeconfig.yaml
        export MGC_REGISTRY_NAME=${{ secrets.MGC_REGISTRY_NAME }}
        envsubst < k8s/app.yaml | kubectl apply -f -
        kubectl apply -f k8s/hpa.yaml
        kubectl rollout status deployment/cloud-project